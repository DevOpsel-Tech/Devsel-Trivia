services:
  postgres:
    image: postgres:${POSTGRES_VERSION:?Required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Required}
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - postgres_data:${POSTGRES_MOUNT_PATH:-/var/lib/postgresql/data}
    expose:
      - "5432"
    networks:
      - trivia-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/devopsel-tech/devsel-trivia-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Required}:${POSTGRES_PASSWORD:?Required}@postgres:5432/${POSTGRES_DB:?Required}"
      JWT_SECRET: ${JWT_SECRET:?Required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Required}
    # Apply committed migrations before starting the API.
    command: ["sh", "-c", "npm run db:migrate:deploy && exec node dist/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      trivia-private: {}
      proxy-network:
        aliases:
          - trivia-backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    image: ghcr.io/devopsel-tech/devsel-trivia-frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      proxy-network:
        aliases:
          - trivia-frontend

networks:
  proxy-network:
    external: true
    name: webs-temporales_default
  trivia-private:
    driver: bridge
    internal: true

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME:?Required}
